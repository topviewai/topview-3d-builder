name: Release to PyPI

# A v* tag publishes to PyPI, and only after the repository variable PYPI_PUBLISH_ENABLED is set to
# "true". A manual run (workflow_dispatch) publishes the same build to TestPyPI instead. Both use
# Trusted Publishing (OIDC) through the pypi / testpypi environments; no upload credential is stored
# in GitHub. TestPyPI refuses a version it already has, so bump the version between test uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: python scripts/set_version.py --check
      - name: Tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('agent/topview_3d_cli/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match version $version"; exit 1; fi
      - run: pnpm -C editor install --frozen-lockfile
      - run: python -m pip install build
      - run: python scripts/build_dist.py --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/topview-3d-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/topview-3d-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
